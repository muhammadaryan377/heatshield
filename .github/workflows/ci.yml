name: HeatShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m compileall app
      - run: pytest -q
      - name: Smoke test real setup flow
        env:
          DATABASE_PATH: /tmp/heatshield-ci.db
          HEATSHIELD_USE_FIXTURES: 'false'
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          assert client.get('/api/sites').json() == []

          # Keep CI on the same US operating model as production. These are
          # unambiguous downtown Phoenix, Arizona coordinates, matching the
          # controlled FortyGuard contract probe used during integration.
          site_payload = {
              'name': 'CI Phoenix Work Site',
              'address': 'Phoenix, AZ, USA',
              'center': {'lat': 33.44975, 'lng': -112.0735},
              'polygon': [
                  {'lat': 33.4440, 'lng': -112.0805},
                  {'lat': 33.4440, 'lng': -112.0665},
                  {'lat': 33.4555, 'lng': -112.0665},
                  {'lat': 33.4555, 'lng': -112.0805},
              ],
              'zones': [],
          }
          site_response = client.post('/api/sites', json=site_payload)
          assert site_response.status_code == 201, site_response.text
          site = site_response.json()
          assert site['profile']['siteType'] == 'other'

          intelligence = client.get(f"/api/sites/{site['id']}/intelligence")
          assert intelligence.status_code == 200, intelligence.text
          payload = intelligence.json()
          assert payload['workers'] == []
          assert payload['conditions'] is None
          assert payload['dataStatus'] == 'configuration_required'

          profile = client.post(
              f"/api/sites/{site['id']}/fortyguard-profile",
              json={'date': '2024-07-15', 'thresholdC': 30, 'granularityMeters': 100},
          )
          assert profile.status_code == 200, profile.text
          profile_payload = profile.json()
          assert profile_payload['dataStatus'] == 'configuration_required'
          assert profile_payload['providerRequestCount'] == 0

          historical = client.post(
              f"/api/sites/{site['id']}/historical-heat-behavior",
              json={
                  'startDate': '2024-07-01',
                  'endDate': '2024-07-30',
                  'thresholdF': 95,
                  'granularityMeters': 100,
              },
          )
          assert historical.status_code == 200, historical.text
          history_payload = historical.json()
          assert history_payload['dataStatus'] == 'configuration_required'
          assert history_payload['providerRequestCount'] == 0
          assert history_payload['dayCount'] == 30
          assert round(history_payload['thresholdC'], 1) == 35.0

          worker_payload = {
              'name': 'Test Worker',
              'role': 'Roofer',
              'location': 'Roof Area',
              'locationId': 'roof-area',
              'coordinate': {'lat': 33.44975, 'lng': -112.0735},
              'task': 'Roof installation',
              'workIntensity': 'heavy',
              'sunExposure': 'direct',
              'shadeAccess': 'limited',
              'waterAccess': True,
          }
          worker_response = client.post(f"/api/sites/{site['id']}/workers", json=worker_payload)
          assert worker_response.status_code == 201, worker_response.text
          worker = worker_response.json()
          assert len(client.get(f"/api/sites/{site['id']}/workers").json()) == 1

          zone_response = client.post(
              f"/api/sites/{site['id']}/zones",
              json={
                  'name': 'Approved Roof Zone',
                  'type': 'roof',
                  'center': {'lat': 33.44975, 'lng': -112.0735},
                  'polygon': [
                      {'lat': 33.4488, 'lng': -112.0746},
                      {'lat': 33.4503, 'lng': -112.0745},
                      {'lat': 33.4498, 'lng': -112.0725},
                  ],
                  'allowedTasks': ['Roof installation'],
                  'operationalApproved': True,
              },
          )
          assert zone_response.status_code == 201, zone_response.text
          assert len(zone_response.json()['zones']) == 1
          assert len(zone_response.json()['zones'][0]['polygon']) == 3

          update_response = client.put(
              f"/api/sites/{site['id']}",
              json={
                  'name': 'CI Phoenix Work Site Updated',
                  'address': 'Phoenix, AZ, USA',
                  'center': {'lat': 33.44975, 'lng': -112.0735},
                  'polygon': site_payload['polygon'],
                  'status': 'active',
                  'profile': {
                      'siteType': 'construction',
                      'surfaceType': 'concrete',
                      'shadeAvailability': 'limited',
                      'waterStations': 2,
                      'recoveryAreas': 1,
                      'typicalTasks': ['Roof installation'],
                  },
              },
          )
          assert update_response.status_code == 200, update_response.text
          assert update_response.json()['name'] == 'CI Phoenix Work Site Updated'
          assert update_response.json()['profile']['waterStations'] == 2

          planner = client.post(
              f"/api/sites/{site['id']}/operational-planner",
              json={'offsetsHours': [1], 'granularityMeters': 100, 'minImprovementC': 1},
          )
          assert planner.status_code == 200, planner.text
          planner_payload = planner.json()
          assert planner_payload['providerRequestCount'] == 0
          assert planner_payload['approvedZoneCount'] == 1
          assert len(planner_payload['workers']) == 1
          assert planner_payload['workers'][0]['workerId'] == worker['id']
          assert planner_payload['workers'][0]['now']['status'] == 'unavailable'

          approval = client.post(
              f"/api/sites/{site['id']}/operational-planner/approvals",
              json={'workerId': worker['id'], 'choice': 'now'},
          )
          assert approval.status_code == 201, approval.text
          assert approval.json()['status'] == 'pending_verification'

          verification = client.post(
              f"/api/sites/{site['id']}/operational-planner/approvals/{approval.json()['id']}/verify"
          )
          assert verification.status_code == 200, verification.text
          assert verification.json()['status'] == 'verification_unavailable'
          print('HeatShield US setup, site editing, polygon zones, historical behavior and planner smoke test passed')
          PY
